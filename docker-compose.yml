version: '3.8'

services:
  sftp:
    image: atmoz/sftp
    container_name: local_sftp_partner
    ports:
      - "2222:22"
    volumes:
      - "./sftp-data/upload:/home/${SFTP_USER:?Missing SFTP_USER}/upload"
    command: "${SFTP_USER}:${SFTP_PASSWORD}:::upload"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: