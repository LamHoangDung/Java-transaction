# DATABASE
db.url=jdbc:postgresql://localhost:5432/qr_reconciliation_db
db.username=${DB_USERNAME}
db.password=${DB_PASSWORD}
db.pool.size=10

# SFTP CLIENT
sftp.host=localhost
sftp.port=2222
sftp.username=${SFTP_USER}
sftp.password=${SFTP_PASSWORD}
sftp.remote.path=/upload/

# SFTP SERVER LOCAL
sftp.server.port=2222
sftp.server.host.key.path=sftp_host_key
sftp.server.upload.dir=sftp-data/upload


# PARTNER FILE DIRECTORIES
partner.source.dir=sftp-data/source
partner.upload.dir=sftp-data/upload
partner.local.dir=partner

# EMAIL
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.username=${MAIL_USERNAME}
mail.password=${MAIL_PASSWORD}
mail.from=${MAIL_FROM}
mail.to=${MAIL_TO}


# RSA KEY
rsa.public.key=${RSA_PUBLIC_KEY}
rsa.private.key=${RSA_PRIVATE_KEY}